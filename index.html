<title>SVN Kalkulation – Verzehrpreise</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gelb:#fbdf00;--schwarz:#000;--weiss:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;background:var(--gelb);color:var(--schwarz);font-family:'Libre Franklin',Inter,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:32px 16px;}
.box{width:100%;max-width:340px;text-align:center;}
.box img{display:block;height:150px;width:auto;margin:0 auto 44px;}
.club{font-family:'League Spartan',Oswald,Arial,sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;}
h1{font-family:'League Spartan',Oswald,Arial,sans-serif;font-weight:900;font-size:42px;line-height:1;text-transform:uppercase;margin:6px 0 30px;}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:13px 16px;border:2px solid var(--schwarz);border-radius:12px;background:var(--weiss);color:var(--schwarz);}
input[type=password]:focus{outline:3px solid var(--schwarz);outline-offset:2px;}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;font-size:16px;padding:13px 16px;border:0;border-radius:999px;background:var(--schwarz);color:var(--weiss);cursor:pointer;}
button:disabled{opacity:.6;cursor:wait;}
.keep{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:14px;cursor:pointer;}
.keep input{width:18px;height:18px;accent-color:#000;}
.err{min-height:22px;margin-top:14px;font-weight:700;font-size:14px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>

<script>
"use strict";
(function(){
  var P={"iter":250000,"salt":"QxgOS+k2T/EOYptv/MSc5g==","iv":"3Q/RzJyStKXM8Qs2"}, KEY="svn-kalk:schluessel";
  var sub=window.crypto&&window.crypto.subtle;
  var $=function(id){return document.getElementById(id);};
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
  var ub64=function(u){var s="";for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);};
  function stored(){try{return sessionStorage.getItem(KEY)||localStorage.getItem(KEY);}catch(e){return null;}}
  function store(raw,keep){try{sessionStorage.setItem(KEY,raw);if(keep)localStorage.setItem(KEY,raw);}catch(e){}}
  function forget(){try{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);}catch(e){}}
  function decrypt(key){
    return sub.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64($("payload").textContent.trim()))
      .then(function(buf){return new TextDecoder().decode(buf);});
  }
  function show(html){document.open();document.write(html);document.close();}
  function fail(msg){$("err").textContent=msg;$("go").disabled=false;$("go").textContent="Öffnen";$("pw").select();}
  if(!sub){
    $("err").textContent="Dieser Browser kann die Datei nicht entschlüsseln. Bitte in einem aktuellen Chrome, Edge, Safari oder Firefox öffnen.";
    $("go").disabled=true; return;
  }
  /* Already unlocked in this tab or on this device */
  var raw=stored();
  if(raw){
    sub.importKey("raw",b64(raw),"AES-GCM",false,["decrypt"]).then(decrypt).then(show)
      .catch(function(){forget();$("pw").focus();});
  } else $("pw").focus();
  $("f").addEventListener("submit",function(ev){
    ev.preventDefault();
    var pw=$("pw").value, keep=$("keep").checked; if(!pw) return;
    $("go").disabled=true; $("go").textContent="Prüfe …"; $("err").textContent="";
    var key;
    sub.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"])
      .then(function(base){return sub.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},true,["decrypt"]);})
      .then(function(k){key=k;return decrypt(k);})
      .then(function(html){
        return sub.exportKey("raw",key).then(function(r){store(ub64(new Uint8Array(r)),keep);show(html);});
      })
      .catch(function(){fail("Falsches Passwort.");});
  });
})();
</script>
